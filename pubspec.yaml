name: matmon
description: "Caça ao Tesouro Bíblico Offline"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  crypto: ^3.0.3
  intl: ^0.19.0
  permission_handler: ^11.3.1
  path_provider: ^2.1.3
  share_plus: ^10.1.0
  gal: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: "assets/icon/matmon_icon.png"
  android: "launcher_icon"
  adaptive_icon_background: "#12100D"
  adaptive_icon_foreground: "assets/icon/matmon_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
